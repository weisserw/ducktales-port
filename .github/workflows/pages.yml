name: Build and deploy browser port

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v6
        with:
          path: ducktales
      - name: Check out ROMAtlas runtime and browser tools
        uses: actions/checkout@v6
        with:
          repository: weisserw/romatlas
          ref: 4f89589581fc7ea0173ce2c4d17fcbac1cd788f9
          path: romatlas
      - name: Install Rust and Wasm target
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.90.0
      - name: Install Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Rust build and binding tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            romatlas/tools/wasm-bindgen
            ducktales/port/target
          key: pages-${{ runner.os }}-rust-1.90.0-bindgen-0.2.129-${{ hashFiles('ducktales/port/Cargo.lock') }}
      - name: Install matching Wasm bindings generator
        shell: bash
        run: |
          if [[ ! -x romatlas/tools/wasm-bindgen/bin/wasm-bindgen ]] || [[ "$(romatlas/tools/wasm-bindgen/bin/wasm-bindgen --version)" != 'wasm-bindgen 0.2.129' ]]; then
            cargo +1.90.0 install wasm-bindgen-cli --version 0.2.129 --locked --root "$GITHUB_WORKSPACE/romatlas/tools/wasm-bindgen"
          fi
      - name: Build static browser bundle
        run: python3 ducktales/scripts/build-pages.py
      - name: Verify browser controls, snapshots and widescreen
        run: |
          node ducktales/scripts/test-browser-gamepads.mjs
          node ducktales/scripts/test-save-state.mjs
          DUCKTALES_WEB_DIST=ducktales/web-dist node ducktales/scripts/test-wasm-snapshot.mjs
          DUCKTALES_WEB_DIST=ducktales/web-dist node ducktales/scripts/test-widescreen.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ducktales/web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
